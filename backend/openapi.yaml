openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /script:
    post:
      description: Run once against a fresh database. Fails if the collections already have data (insertMany will reject on duplicates if re-run without clearing first).
      operationId: ScriptController_create
      parameters: []
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      summary: Seed default access groups and company categories
      tags:
        - Script
  /script/create-product:
    post:
      description: Run once against a fresh database. The seeded product names are placeholders — edit ScriptService.createProduct() to reflect your own product catalog.
      operationId: ScriptController_createProduct
      parameters: []
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      summary: Seed example products
      tags:
        - Script
  /auth/create-user/{admin_mail}:
    post:
      operationId: AuthController_createCompanyUser
      parameters:
        - name: admin_mail
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Details for creating a company user. A temporary password is generated and provisioned in Keycloak automatically — returned in the response, not supplied here.
        content:
          application/json:
            schema:
              type: object
              properties:
                company_ifric_id:
                  type: string
                  example: IFRIC12345
                user_name:
                  type: string
                  example: John Doe
                user_email:
                  type: string
                  example: johndoe@example.com
                user_role:
                  type: string
                  example: admin
                  description: Access group name (matches AccessGroup.group_name)
              required:
                - company_ifric_id
                - user_name
                - user_email
                - user_role
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/login:
    post:
      operationId: AuthController_logIn
      parameters: []
      requestBody:
        required: true
        description: User login details
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: securepassword123
              required:
                - email
                - password
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-indexed-db-data:
    post:
      operationId: AuthController_getIndexedData
      parameters: []
      requestBody:
        required: true
        description: Retrieve indexed database data
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                  description: The email of the user
                company_id:
                  type: string
                  example: COMPANY_ID_123
                  description: The unique ID of the company
              required:
                - email
                - company_id
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/authenticate-token:
    post:
      operationId: AuthController_authenticateToken
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-company-users/{id}:
    get:
      operationId: AuthController_getCompanyUsers
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-company-users-access/{company_ifric_id}:
    get:
      operationId: AuthController_getCompanyUsersAccess
      parameters:
        - name: company_ifric_id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-user-profile-content/{company_ifric_id}/{user_id}:
    get:
      operationId: AuthController_getUserProfileContent
      parameters:
        - name: company_ifric_id
          required: true
          in: path
          schema:
            type: string
        - name: user_id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-user-product-access/{id}:
    get:
      operationId: AuthController_getUserProductAccess
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-user-details:
    get:
      operationId: AuthController_getUserDetails
      parameters:
        - name: user_email
          required: true
          in: query
          schema:
            type: string
        - name: company_ifric_id
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-total-users:
    get:
      operationId: AuthController_getTotalUsers
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-user-details/{id}:
    get:
      operationId: AuthController_getUserDetailsById
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/get-user-details-by-email/{email}:
    get:
      operationId: AuthController_getUserDetailsByEmail
      parameters:
        - name: email
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/check-company-admin/{email}:
    get:
      operationId: AuthController_checkCompanyAdmin
      parameters:
        - name: email
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/update-password:
    patch:
      operationId: AuthController_updateUserPassword
      parameters: []
      requestBody:
        required: true
        description: Change a Company or CompanyUser password, verifying the old password first
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                  description: The email of the user
                oldPassword:
                  type: string
                  example: OldWeakP@ssw0rd!
                  description: The current password, verified before updating
                newPassword:
                  type: string
                  example: NewStrongP@ssw0rd!
                  description: The new password for the user
              required:
                - email
                - oldPassword
                - newPassword
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/update-user-access-group/{id}:
    patch:
      operationId: AuthController_updateUserAccessGroup
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Grants the user (CompanyUser :id) the named access group role.
        content:
          application/json:
            schema:
              type: object
              properties:
                user_role:
                  type: string
                  example: admin
                  description: Access group name (matches AccessGroup.group_name)
              required:
                - user_role
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/update-company-user:
    patch:
      operationId: AuthController_updateCompanyUser
      parameters: []
      requestBody:
        required: true
        description: Update user details with optional fields for user information and password changes
        content:
          application/json:
            schema:
              type: object
              properties:
                company_ifric_id:
                  type: string
                  example: company-ifric-123
                  description: Unique identifier for the company
                user_id:
                  type: string
                  example: user-456
                  description: Unique identifier for the user
                user_name:
                  type: string
                  example: John Doe
                  description: Name of the user
                user_email:
                  type: string
                  example: john.doe@example.com
                  description: Email address of the user
                user_image:
                  type: string
                  example: https://example.com/path/to/image.jpg
                  description: URL to the user's profile image
                old_password:
                  type: string
                  example: OldPassword123
                  description: Old password for the user (if changing password)
                new_password:
                  type: string
                  example: NewPassword456
                  description: New password for the user (if changing password). Verified and updated against Keycloak.
              required:
                - company_ifric_id
                - user_id
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/delete-company-user/{id}:
    delete:
      operationId: AuthController_deleteCompanyUser
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: AuthController_logOut
      parameters: []
      requestBody:
        required: true
        description: Log out a user. Pass refresh_token (the one returned by /auth/login) to also revoke the session at Keycloak — omitting it still returns success but leaves the Keycloak session live until it naturally expires.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                  description: The email address of the user to log out
                refresh_token:
                  type: string
                  description: Optional. The refresh token to revoke at Keycloak.
              required:
                - email
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        description: Exchange a refresh token (obtained from /auth/login) for a new, short-lived access token. Fails if the refresh token has expired or been revoked (e.g. by /auth/logout). Keycloak rotates refresh tokens by default, so the response also includes a new refresh_token — use it for the next refresh instead of the original.
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token obtained from /auth/login
              required:
                - refresh_token
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/recover-password-request:
    post:
      operationId: AuthController_recoverPasswordRequest
      parameters: []
      requestBody:
        required: true
        description: Start password recovery. Keycloak emails the account holder a one-time link to set a new password; the response is a fixed acknowledgement that never contains a credential and is identical whether or not the address has an account. The existing password keeps working until the link is used. Requires realm SMTP to be configured (docs/keycloak-first-time-checklist.md) — if the mail cannot be sent the call fails rather than falling back to anything. Throttled per address and per caller IP (429 when exceeded).
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                  description: The email address of the user requesting password recovery
              required:
                - email
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /auth/recover-password:
    post:
      operationId: AuthController_recoverPassword
      parameters: []
      requestBody:
        required: true
        description: Set a new password for a user who already knows their current one (verified against Keycloak first). Recovery itself no longer issues a temporary password — recover-password-request hands the user off to Keycloak — so this is now just a password change that does not need a bearer token; `temporaryPassword` is whatever the current password is.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                  description: The email address of the user
                temporaryPassword:
                  type: string
                  example: Temp@1234
                  description: The user's current password (historically a temporary one)
                newPassword:
                  type: string
                  example: NewStrongP@ssw0rd!
                  description: The new password to be set for the user
              required:
                - email
                - temporaryPassword
                - newPassword
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Auth
  /company/factories:
    get:
      description: Pass owner_company_ifric_id to filter to just the factories owned by that company (required to be your own company — this is not a cross-company directory). Omitting it lists every factory across every company.
      operationId: CompanyController_getFactories
      parameters:
        - name: owner_company_ifric_id
          required: false
          in: query
          description: Filter to factories owned by this company
          schema:
            example: urn:ifric:ifx-eur-com-own-42ced491-b35d-41f7-9949-fcbb5fa4dcd9
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Get all factories, optionally filtered by owner
      tags:
        - Company
    post:
      description: Creates a physical factory location and tags it to an owner company via owner_company_ifric_id.
      operationId: CompanyController_createFactory
      parameters: []
      requestBody:
        required: true
        description: Details for creating a factory
        content:
          application/json:
            schema:
              type: object
              required:
                - factory_id
                - owner_company_ifric_id
              properties:
                factory_id:
                  type: string
                  example: urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
                owner_company_ifric_id:
                  type: string
                  example: urn:ifric:ifx-eur-com-own-42ced491-b35d-41f7-9949-fcbb5fa4dcd9
                location_name:
                  type: string
                  example: Plant 1
                address_1:
                  type: string
                  example: 123 Main St
                city:
                  type: string
                  example: Berlin
                country:
                  type: string
                  example: Germany
                zip:
                  type: string
                  example: '10115'
                latitude:
                  type: number
                  example: 52.52
                longitude:
                  type: number
                  example: 13.405
                timezone:
                  type: string
                  example: Europe/Berlin
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      summary: Create a factory tagged to an owner company
      tags:
        - Company
  /company/factories/{id}:
    get:
      operationId: CompanyController_getFactoryById
      parameters:
        - name: id
          required: true
          in: path
          description: Factory id, e.g. urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
          schema:
            example: urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Get factory details for a factory id
      tags:
        - Company
    patch:
      description: Updates the location details of an existing factory.
      operationId: CompanyController_updateFactory
      parameters:
        - name: id
          required: true
          in: path
          description: Factory id
          schema:
            example: urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Update a factory
      tags:
        - Company
    delete:
      description: Deletes a factory. Fails with 409 if any asset still references this factory_id.
      operationId: CompanyController_deleteFactory
      parameters:
        - name: id
          required: true
          in: path
          description: Factory id
          schema:
            example: urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Delete a factory
      tags:
        - Company
  /company/factories/{id}/owner:
    get:
      operationId: CompanyController_getFactoryOwner
      parameters:
        - name: id
          required: true
          in: path
          description: Factory id, e.g. urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
          schema:
            example: urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Get the owner company for a factory id
      tags:
        - Company
  /company/factories/{id}/products:
    get:
      description: Returns every asset URN (see GET /company/assets/*) whose factory_id resolves to this factory id.
      operationId: CompanyController_getFactoryProducts
      parameters:
        - name: id
          required: true
          in: path
          description: Factory id, e.g. urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
          schema:
            example: urn:ifric:ifx-eur-loc-fac-bd063b72-8748-461f-888d-3ea75058f205
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Get all asset URNs located at a factory id
      tags:
        - Company
  /company/assets:
    post:
      description: company_ifric_id is the registering/manufacturer company (always required). Provide owner_company_ifric_id (+ optionally factory_id) now to create it already "twinned", or add them later via PATCH.
      operationId: CompanyController_createAsset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_ifric_id
                - company_ifric_id
              properties:
                asset_ifric_id:
                  type: string
                  example: urn:asset:alpha-machine-001
                company_ifric_id:
                  type: string
                  example: urn:ifric:ifx-eur-com-own-42ced491-b35d-41f7-9949-fcbb5fa4dcd9
                owner_company_ifric_id:
                  type: string
                factory_id:
                  type: string
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      summary: Create an asset
      tags:
        - Company
    get:
      operationId: CompanyController_getAssets
      parameters:
        - name: company_ifric_id
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/{id}:
    patch:
      operationId: CompanyController_updateAsset
      parameters:
        - name: id
          required: true
          in: path
          description: Asset URN (asset_ifric_id)
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Update an asset — setting owner_company_ifric_id "twins" it
      tags:
        - Company
    delete:
      operationId: CompanyController_deleteAsset
      parameters:
        - name: id
          required: true
          in: path
          description: Asset URN (asset_ifric_id)
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
    get:
      operationId: CompanyController_getAssetByAssetIfricId
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/bulk:
    delete:
      operationId: CompanyController_deleteAssets
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/manufacturer/{company_ifric_id}:
    get:
      operationId: CompanyController_getManufacturerAssets
      parameters:
        - name: company_ifric_id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/owner/{company_ifric_id}:
    get:
      operationId: CompanyController_getOwnerAssets
      parameters:
        - name: company_ifric_id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/manufacturer/{manufacturer_company_ifric_id}/owner/{owner_company_ifric_id}:
    get:
      operationId: CompanyController_getManufacturerOwnerAssets
      parameters:
        - name: manufacturer_company_ifric_id
          required: true
          in: path
          schema:
            type: string
        - name: owner_company_ifric_id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/count:
    get:
      operationId: CompanyController_getAssetCount
      parameters:
        - name: asset_ifric_ids
          required: true
          in: query
          description: Comma-separated asset URNs
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/count/{company_ifric_id}:
    get:
      operationId: CompanyController_getAssetCountByCompany
      parameters:
        - name: company_ifric_id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/{id}/manufacturer:
    get:
      operationId: CompanyController_getAssetManufacturer
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/{id}/owner:
    get:
      operationId: CompanyController_getAssetOwner
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/assets/{id}/factory-location:
    get:
      operationId: CompanyController_getAssetFactoryLocation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/devices:
    post:
      operationId: CompanyController_createCompanyDevice
      parameters: []
      requestBody:
        required: true
        description: Details for creating a company gateway/server
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - company_ifric_id
              properties:
                type:
                  type: string
                  enum:
                    - gateway
                    - server
                  example: gateway
                company_ifric_id:
                  type: string
                  example: IFRIC12345
                gateway_ifric_id:
                  type: string
                  description: Required when type is "gateway"
                  example: GATEWAY112233
                server_ifric_id:
                  type: string
                  description: Required when type is "server"
                  example: SERVER445566
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      tags:
        - Company
  /company/create-access-group/{id}:
    post:
      operationId: CompanyController_createAccessGroup
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Details for creating an access group
