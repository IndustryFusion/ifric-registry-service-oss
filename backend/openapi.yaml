info:
  title: Ifric Registry Service
  description: Open-source multi-tenant company/user/access-control/digital-twin registry service, split into Auth (session/identity), Company (company CRUD, access groups, physical assets), Product (product catalog, digital twins), Certificate, and Script (one-time seed data) controllers. Authentication has no built-in implementation of its own — Keycloak is the sole identity provider (POST /auth/login, refreshed via POST /auth/refresh, both backed by Keycloak's token endpoint); every bearer token below is issued and verified by Keycloak, not signed locally. Certificate issuance and company_ifric_id minting integrate with an external open-source ICID-compatible service (see README.md).
  version: 0.1.0
  contact: {}
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas: {}
