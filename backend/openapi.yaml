      operationId: CompanyController_createCompany
      parameters:
        - name: X-API-Key
          in: header
          description: Placeholder gate ahead of a real external-API-token flow — must match COMPANY_CREATION_API_KEY. No Keycloak bearer token is required here, since the company's users have no Keycloak accounts yet at creation time.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: 'Details for creating a company. company_ifric_id is deliberately absent: it is minted by ICID during this call and assigned by CompanyService.createCompany, so anything a caller sends is overwritten before it is ever read.'
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  example: Example Company Ltd.
                registration_number:
                  type: string
                  example: REG123456
                address_1:
                  type: string
                  example: 123 Main Street
                city:
                  type: string
                  example: New York
