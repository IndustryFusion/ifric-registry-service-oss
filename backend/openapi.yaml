                  type: string
                  description: Full official country name as recognised by the countries-list package — e.g. 'United States', 'United Kingdom', 'Germany'. Abbreviations and ISO codes are rejected.
                  example: United States
                zip:
                  type: string
                  example: '10001'
                admin_name:
                  type: string
                  example: John Admin
                position:
                  type: string
                  example: CEO
                email:
                  type: string
                  example: admin@example.com
                company_size:
                  type: string
                  example: 100-500
                company_category:
                  type: string
                  enum:
                    - manufacturer
                    - machine_builder
                    - factory_owner
                    - user
                    - public
                    - service_provider
                    - retailer
                    - logistics
                    - recycler
                  example: manufacturer
