info:
  title: Ifric Registry Service - Company API
  description: 'Scoped to just the /company/* endpoints (CompanyController): company CRUD, access groups, physical assets (CompanyAsset/GateWay/Server), and factory-keyed lookups. See openapi.yaml for the full API surface.'
  version: 0.1.0
  contact: {}
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas: {}
