#
# Full-stack compose: a real ICID instance (with its own required MongoDB) +
# this registry service (backed by its own PostgreSQL) — all wired together.
# This is a superset of docker-compose.yaml — use that one instead if you
# don't need company creation or certificates and don't want to build ICID's
# image.
#
# Quick start:
#   docker compose -f docker-compose.full.yaml up --build
#   curl -X POST http://localhost:4010/script   # seed ICID's taxonomy (once)
#   curl -X POST http://localhost:4007/script   # seed this service's RBAC/categories (once)
#
# Keycloak comes up unconfigured — do the one-time realm/client setup in
# docs/keycloak-first-time-checklist.md or this stack won't authenticate.
# README.md's "ICID Dependency" covers why COMPANY_DEFAULT_CODE must be
# exactly IFX-COM-NAP; docs/local-development.md covers what to do if your
# Docker daemon blocks build-time network access.
#
services:
  # ICID's own dependency, unrelated to this service's persistence (see
  # `postgres` below) — ICID is run unmodified from its own repo, so its
  # MongoDB requirement can't be changed here.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_full_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: initiates the single-node replica set ICID's own transactions
  # require on first start (idempotent — safe to leave in place across
  # restarts). This registry service no longer needs a replica set itself
  # (see `postgres`/`migrate` below) — this sidecar exists purely for ICID.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e

        # Idempotency comes from attempting rs.initiate() and tolerating the
        # one error that means "somebody already did this" — NOT from
        # probing rs.status() first. rs.status() throwing does not mean "not
        # initiated yet": it also throws while a restarted mongod is still
        # loading a config it already has in mongo_full_data. Treating that
        # as "not initiated" led straight into an rs.initiate() that died
        # with "MongoServerError: already initialized", failing this
        # one-shot and so blocking `icid`, which waits on it — over a
        # MongoDB that was in fact perfectly healthy.
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            print("replica set initiated");
          } catch (e) {
            // 23 = AlreadyInitialized. Anything else is real — a mongod
            // started without --replSet, an unreachable host — and should
            // fail loudly rather than be swallowed.
            if (e.code !== 23) { throw e; }
            print("replica set already initiated");
          }
        '

        # ICID connects with ?replicaSet=rs0, which needs a primary, not
        # just a listening mongod — election takes a moment after a fresh
        # initiate. Waiting here keeps that out of ICID's startup path.
        echo "waiting for rs0 to elect a primary..."
        attempts=0
        until [ "$$(mongosh --host mongo:27017 --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null)" = "true" ]; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -gt 60 ]; then
            echo "!! rs0 has a config but never reached PRIMARY after ~2 minutes:"
            mongosh --host mongo:27017 --quiet --eval 'printjson(rs.status())' || true
            echo "!! If the members listed are not mongo:27017, this volume was initiated"
            echo "!! under a different host name — repoint it with rs.reconfig(), or start"
            echo "!! clean: docker compose -f docker-compose.full.yaml down -v"
            exit 1
          fi
          sleep 2
        done
        echo "rs0 is ready at mongo:27017"

  # This registry service's own database — separate from ICID's MongoDB
  # above.
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=ifric
      - POSTGRES_PASSWORD=ifric
      - POSTGRES_DB=ifric_registry_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_full_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifric"]
      interval: 5s
      timeout: 5s
      retries: 10

  # This app's sole identity provider — see backend/.env.example and
  # backend/src/common/env.constants.ts. The app itself only talks to
  # Keycloak once KEYCLOAK_URL etc. are set (below), but this service
  # comes up unconditionally so it's reachable the moment someone wants to
  # configure it. Realm/client setup (a confidential "ifric" client with
  # Direct Access Grants enabled, and a confidential "ifric-admin" client
  # with its service account granted the realm-management client's
  # "manage-users" role) is a one-time MANUAL step via the admin console
  # at http://localhost:8080 — follow docs/keycloak-first-time-checklist.md.
  # Not for production:
  # hardcoded admin console credentials below. KC_DB points at this same
  # Postgres instance/database — Keycloak namespaces its own tables, so
  # there's no collision with this app's tables, and it avoids standing up
  # a third datastore just for Keycloak's own config store.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/ifric_registry_service
      - KC_DB_USERNAME=ifric
      - KC_DB_PASSWORD=ifric
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3 && grep 'HTTP/1.1 200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  # One-shot: applies TypeORM migrations before ifric-registry-backend
  # starts (idempotent). Runs from the same image, just with a different
  # command.
  migrate:
    build:
      context: ./backend
      network: host
    command: ["npm", "run", "migration:run"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ifric
      - DB_PASSWORD=ifric
      - DB_NAME=ifric_registry_service
      # DB_SSL now defaults to on (see backend/.env.example) — explicitly
      # disabled here since the bundled postgres service above has no TLS
      # listener.
      - DB_SSL=false
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ICID mints company_ifric_id and issues/verifies certificates — a separate
  # open-source service (https://github.com/IndustryFusion/icidservice), not
  # vendored into this repo. Pulled as a published, unmodified image — no
  # build step, no git-context/network dependency at `up` time.
  #
  # Only /company, /script, and /certificate/* are exercised by this stack —
  # verified against ICID's actual source (github.com/IndustryFusion/icidservice),
  # not assumed. Two env vars ICID reads are deliberately left unset since
  # nothing here calls the endpoints that need them: HBAR_URL/ASSET_VC_TOPIC_ID
  # (certificate.service.ts — only the Hedera sub-account/cert-issuance calls)
  # and CONTRACT_DEFAULT_CODE/BINDING_DEFAULT_CODE (contract.service.ts — only
  # POST /contract and /binding). Calling those endpoints without them set
  # throws (e.g. `.split('-')` on undefined) — expected, not a bug here.
  icid:
    image: ibn40/icid-backend:latest
    ports:
      - "4010:4010"
    environment:
      - MONGO_URL=mongodb://mongo:27017/icid-service?replicaSet=rs0
      - CORS_ORIGIN=http://localhost:4007
      # UUID namespace ICID uses to derive ids (uuidv5) — any valid UUID
      # works, it's a seed value, not a secret. Override via a .env file
      # next to this compose file if you want a different one.
      - IFRIC_NAMESPACE=${IFRIC_NAMESPACE:-1b671a64-40d5-491e-99b0-da01ff1f3341}
      # Skips ICID's Vault-secrets-fetch entrypoint script
      # (fetch_env_from_vault.sh) so it boots straight from the env vars
      # above instead of requiring a running Vault instance.
      - ENV=prod
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4010/api-docs-json"]
      interval: 5s
      timeout: 5s
      retries: 15
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  ifric-registry-backend:
    build:
      context: ./backend
      network: host
    ports:
      - "4007:4007"
    environment:
      # DB_SSL now defaults to on (see backend/.env.example) — explicitly
      # disabled since the bundled postgres above has no TLS listener.
      - DB_SSL=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ifric
      - DB_PASSWORD=ifric
      - DB_NAME=ifric_registry_service
      - PORT=4007
      - CORS_ORIGIN=http://localhost:3000
      - ICID_SERVICE_BACKEND_URL=http://icid:4010
      - HEDERA_KEY_SECRET=${HEDERA_KEY_SECRET:-dev-only-hedera-key-32-bytes-min}
      # Must match an object-type/subtype pair already seeded in ICID (its
      # own POST /script seeds object_type "COM" with subtype "NAP" for
      # companies, case-sensitive) — confirmed against ICID's actual seed
      # data, see README.md's "ICID Dependency".
      - COMPANY_DEFAULT_CODE=IFX-COM-NAP
      # Placeholder gate for POST /company/create-company ahead of the real
      # external-API-token flow — see backend/.env.example. Safe to
      # generate a default like HEDERA_KEY_SECRET above, since this is a
      # throwaway local-dev value, not an external system's real secret.
      - COMPANY_CREATION_API_KEY=${COMPANY_CREATION_API_KEY:-dev-only-company-creation-key}
      # Keycloak realm/client setup is a one-time MANUAL step (admin
      # console at http://localhost:8080 — see
      # docs/keycloak-first-time-checklist.md), so unlike
      # JWT_SECRET/HEDERA_KEY_SECRET above these have no safe generated
      # default. Left blank until you've done that setup, this container
      # will crash-loop on env.constants.ts's fail-fast check — bring the
      # stack up once to get Keycloak running, do the manual setup, put
      # the resulting values in a .env file next to this compose file (or
      # export them), then `docker compose -f docker-compose.full.yaml up`
      # again.
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-ifric}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-ifric}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-ifric-admin}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      icid:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  mongo_full_data:
  postgres_full_data:
