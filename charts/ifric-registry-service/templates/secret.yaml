{{- if not .Values.secrets.existingSecret }}
{{/*
KEYCLOAK_ADMIN_PASSWORD (Keycloak's own admin-console login for this
release's bundled instance — not to be confused with the OAuth client
secrets below): if not set explicitly in values, generate one on first
install and keep reusing it on every later `helm upgrade` by reading it
back off the Secret already live in the cluster — otherwise each `helm
upgrade` (with no keycloakAdminPassword pinned) would mint a fresh random
value and lock you out of the admin console you need for the one-time
manual realm setup (see README.md). `lookup` only sees real cluster state,
so `helm template`/`--dry-run` always take the "generate fresh" branch —
harmless there since nothing gets applied.
*/}}
{{- $secretName := include "ifric-registry-service.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $keycloakAdminPassword := .Values.secrets.keycloakAdminPassword }}
{{- if not $keycloakAdminPassword }}
  {{- if and $existing (index $existing.data "KEYCLOAK_ADMIN_PASSWORD") }}
    {{- $keycloakAdminPassword = index $existing.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec }}
  {{- else }}
    {{- $keycloakAdminPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ifric-registry-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: {{ $keycloakAdminPassword | quote }}
  # Confidential-client secrets for "ifric" (end-user ROPC login) and
  # "ifric-admin" (Admin API — user create/password-reset/delete). Blank by
  # default — see the comment in configmap.yaml for why these can't be
  # `required` upfront. The backend fails fast at boot if either resolves
  # empty once you've deployed with keycloak.enabled=false (an external,
  # already-configured Keycloak); with the bundled instance, fill these in
  # via `helm upgrade` after completing the one-time manual realm setup.
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloakClientSecret | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ .Values.secrets.keycloakAdminClientSecret | quote }}
  # Optional — blank correctly disables /certificate/* entirely (see
  # backend/src/common/env.constants.ts), the app still boots either way.
  HEDERA_KEY_SECRET: {{ .Values.secrets.hederaKeySecret | quote }}
  DB_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
