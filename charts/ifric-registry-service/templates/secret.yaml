{{- if not .Values.secrets.existingSecret }}
{{/*
Application secrets — everything the backend itself reads. Keycloak's own
console admin password and the bootstrap client secret are deliberately NOT
here: the backend mounts this Secret wholesale with envFrom, so a key in
this file is a key in the environment of the internet-facing app process.
Those two live in templates/keycloak/operator-secret.yaml, which only the
Keycloak Deployment and the bootstrap Job read.

`lookup` only sees real cluster state, so `helm template`/`--dry-run`
always take the "generate fresh" branch — harmless there since nothing gets
applied.
*/}}
{{- $secretName := include "ifric-registry-service.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{/*
COMPANY_CREATION_API_KEY: generate-once-reuse-forever, the same pattern the
two client secrets below use — this is a chart-internal placeholder (no
external system to configure first), so unlike the Keycloak client secrets
it's always safe to auto-generate rather than requiring a manual value.
*/}}
{{- $companyCreationApiKey := .Values.secrets.companyCreationApiKey }}
{{- if not $companyCreationApiKey }}
  {{- if and $existing (index $existing.data "COMPANY_CREATION_API_KEY") }}
    {{- $companyCreationApiKey = index $existing.data "COMPANY_CREATION_API_KEY" | b64dec }}
  {{- else }}
    {{- $companyCreationApiKey = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{/*
The two Keycloak client secrets follow the same generate-once-reuse-forever
pattern, but ONLY when keycloak.bootstrap.enabled — that Job is what pushes
the generated value onto the Keycloak client, so both sides end up holding
the same string and there is nothing to copy by hand. With bootstrap off,
the clients were configured by someone else and only they know the secret:
generating one here would write a value Keycloak has never heard of and
turn a clear "fails fast at boot" into logins that fail at runtime for no
visible reason. So leave it empty and let env.constants.ts refuse to start.
*/}}
{{- $keycloakClientSecret := .Values.secrets.keycloakClientSecret }}
{{- $keycloakAdminClientSecret := .Values.secrets.keycloakAdminClientSecret }}
{{- if .Values.keycloak.bootstrap.enabled }}
  {{- if not $keycloakClientSecret }}
    {{- if and $existing (index $existing.data "KEYCLOAK_CLIENT_SECRET") }}
      {{- $keycloakClientSecret = index $existing.data "KEYCLOAK_CLIENT_SECRET" | b64dec }}
    {{- else }}
      {{- $keycloakClientSecret = randAlphaNum 32 }}
    {{- end }}
  {{- end }}
  {{- if not $keycloakAdminClientSecret }}
    {{- if and $existing (index $existing.data "KEYCLOAK_ADMIN_CLIENT_SECRET") }}
      {{- $keycloakAdminClientSecret = index $existing.data "KEYCLOAK_ADMIN_CLIENT_SECRET" | b64dec }}
    {{- else }}
      {{- $keycloakAdminClientSecret = randAlphaNum 32 }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ifric-registry-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Confidential-client secrets for "ifric" (end-user ROPC login) and
  # "ifric-admin" (Admin API — user create/password-reset/delete). Resolved
  # above: generated and reused across upgrades when the bootstrap Job will
  # push them onto the Keycloak clients, otherwise left exactly as given so
  # a missing one fails fast at boot rather than failing silently at login.
  KEYCLOAK_CLIENT_SECRET: {{ $keycloakClientSecret | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ $keycloakAdminClientSecret | quote }}
  # Optional — blank correctly disables /certificate/* entirely (see
  # backend/src/common/env.constants.ts), the app still boots either way.
  HEDERA_KEY_SECRET: {{ .Values.secrets.hederaKeySecret | quote }}
  # Placeholder gate for POST /company/create-company — see the comment on
  # secrets.companyCreationApiKey in values.yaml.
  COMPANY_CREATION_API_KEY: {{ $companyCreationApiKey | quote }}
  DB_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
