apiVersion: v1
kind: Service
metadata:
  name: {{ include "ifric-registry-service.fullname" . }}-backend
  labels:
    {{- include "ifric-registry-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ifric-registry-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
