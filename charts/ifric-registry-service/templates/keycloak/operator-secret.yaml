{{- if and (not .Values.secrets.existingSecret) (or .Values.keycloak.enabled .Values.keycloak.bootstrap.enabled) }}
{{/*
Credentials that operate Keycloak, kept out of the application Secret on
purpose. The backend Deployment mounts its Secret with envFrom, so every
key in there lands in the environment of the internet-facing app process —
and the app reads neither of these (there is no field for either in
backend/src/common/env.constants.ts). An identity provider's admin
password sitting in the environment of the service it protects is exactly
the blast radius an SSRF, an RCE or a stray heap dump would collect.

  KEYCLOAK_ADMIN_PASSWORD — the bundled Keycloak Deployment's own console
    admin. Read by that Deployment and by nothing else; the bootstrap Job
    no longer uses it (see KEYCLOAK_BOOTSTRAP_CLIENT_SECRET below).

    Whether generating one is safe depends on the topology.
    keycloak.enabled=true: this value is what *creates* that admin account
    on first boot, so generating it is correct — but it must then be
    reused verbatim on every later upgrade, or the console login silently
    stops matching the account Keycloak already created. That is what the
    lookups below are for. keycloak.enabled=false: the instance already
    has an admin password that nothing here can set, so this key is not
    rendered at all rather than filled with a value Keycloak never heard
    of.

  KEYCLOAK_BOOTSTRAP_CLIENT_SECRET — the confidential client the bootstrap
    Job authenticates as instead of the realm/master admin. Never
    generated: the client is created by a human in the console (one-time,
    docs/keycloak-first-time-checklist.md) and Keycloak invents the
    secret, so the only correct source is a copy-paste. A generated value
    would be one Keycloak has never seen, turning "fails fast at install"
    into "the Job can't authenticate for no visible reason".

`lookup` only sees real cluster state, so `helm template`/`--dry-run`
always take the "generate fresh" branch — harmless there, since nothing is
applied.
*/}}
{{- $operatorSecretName := include "ifric-registry-service.keycloakOperatorSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $operatorSecretName }}
{{/*
Releases created before the split kept KEYCLOAK_ADMIN_PASSWORD in the app
Secret. Fall back to it so an upgrade carries the existing console admin
password over instead of minting a new one the running Keycloak has never
been told about.
*/}}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace (include "ifric-registry-service.secretName" .) }}
{{- $keycloakAdminPassword := .Values.secrets.keycloakAdminPassword }}
{{- if and (not $keycloakAdminPassword) .Values.keycloak.enabled }}
  {{- if and $existing (index $existing.data "KEYCLOAK_ADMIN_PASSWORD") }}
    {{- $keycloakAdminPassword = index $existing.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec }}
  {{- else if and $legacy (index $legacy.data "KEYCLOAK_ADMIN_PASSWORD") }}
    {{- $keycloakAdminPassword = index $legacy.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec }}
  {{- else }}
    {{- $keycloakAdminPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- $bootstrapClientSecret := .Values.secrets.keycloakBootstrapClientSecret }}
{{- if and .Values.keycloak.bootstrap.enabled (not $bootstrapClientSecret) }}
  {{- if and $existing (index $existing.data "KEYCLOAK_BOOTSTRAP_CLIENT_SECRET") }}
    {{- $bootstrapClientSecret = index $existing.data "KEYCLOAK_BOOTSTRAP_CLIENT_SECRET" | b64dec }}
  {{- else }}
    {{- fail (printf "secrets.keycloakBootstrapClientSecret is required when keycloak.bootstrap.enabled=true.\n\nThe bootstrap Job no longer signs in as Keycloak's admin — it authenticates as a confidential client (%q) whose service account holds realm-management roles in realm %q and nothing else, so this chart never handles the identity provider's root credential.\n\nCreate it once by hand (steps 1, 2 and 2b of docs/keycloak-first-time-checklist.md): create the realm, create the client with client authentication on and service accounts enabled, grant its service account the realm-management roles manage-clients, manage-realm and manage-users, then copy the secret from its Credentials tab into secrets.keycloakBootstrapClientSecret.\n\nOr set keycloak.bootstrap.enabled=false and configure the realm entirely by hand (the same document, manual path)." .Values.keycloak.bootstrap.clientId .Values.env.keycloak.realm) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $operatorSecretName }}
  labels:
    {{- include "ifric-registry-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-operator-credentials
type: Opaque
stringData:
  {{- if .Values.keycloak.enabled }}
  KEYCLOAK_ADMIN_PASSWORD: {{ $keycloakAdminPassword | quote }}
  {{- end }}
  {{- if .Values.keycloak.bootstrap.enabled }}
  KEYCLOAK_BOOTSTRAP_CLIENT_SECRET: {{ $bootstrapClientSecret | quote }}
  {{- end }}
{{- end }}
